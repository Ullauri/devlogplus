name: TrueCourse

# Refresh the committed TrueCourse analysis baseline after every merge to main.
#
# `.truecourse/LATEST.json` is the materialised current-state view of the repo's
# code findings. TrueCourse's own guidance is to regenerate it *on main only* and
# commit the result -- two feature branches both rewriting a 1.7 MB generated
# JSON conflict on every PR, and a per-branch baseline is not a baseline. So this
# is the one place it is produced, and `.truecourse/LATEST.json` is read-only to
# everyone else. See docs/adr/0008-truecourse-analysis-baseline.md.
#
# The run is a *signal*, never a gate: it does not block a merge (the merge has
# already happened) and it does not fail on findings. Downstream consumers read
# the committed baseline out of git.

on:
  push:
    branches: [main]
  workflow_dispatch:

# The commit-back needs write access. The repository default for GITHUB_TOKEN is
# read-only; a workflow-level `permissions:` block overrides that default, so
# nothing has to change in repository settings. If the push ever 403s, this is
# the first thing to check.
permissions:
  contents: write

# Never cancel in progress: a cancelled run leaves the baseline pointing at an
# older commit than main, which is exactly the state this workflow exists to
# prevent. Queue instead, so the last merge wins.
concurrency:
  group: truecourse-baseline
  cancel-in-progress: false

env:
  # Pinned to a patch range on purpose. Rule keys are the identity a consumer
  # deduplicates on, so a minor bump that renames or splits a rule silently
  # re-files work that is already tracked. Bumping the minor is a deliberate
  # change with a look at the diff, not something that happens on a Tuesday.
  TRUECOURSE_VERSION: "~0.7.4"

jobs:
  baseline:
    name: Refresh analysis baseline
    runs-on: ubuntu-latest
    # Only a main checkout may produce the baseline. Without this, a
    # workflow_dispatch on any other ref would (a) record that ref's branch in
    # the baseline, re-arming the branch-mismatch drop this workflow was fixed
    # to avoid, and (b) `git push HEAD:main` that ref's commits onto main,
    # outside review, whenever the push fast-forwards.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          # The cold scan below uses no git history: the baseline is deleted
          # before analyzing, so nothing diffs against an earlier commit.
          # TrueCourse only reads git to record the branch and commit the
          # analysis describes, which a shallow clone satisfies. Full history
          # is kept because it is cheap here and switching to fetch-depth: 1
          # has not been tested against the analyzer; if you test it, it can
          # likely go.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # TrueCourse requires Node >= 22 (its own .node-version pins 22.x).
          # This is deliberately *not* the repo's NODE_VERSION (20): the tool's
          # runtime and the frontend's runtime are unrelated.
          node-version: "22"

      - name: Install TrueCourse
        run: npm install -g "truecourse@${TRUECOURSE_VERSION}"

      - name: Drop the committed baseline so the scan is cold
        # Chosen mechanism (see the 2026-08-25 amendment to ADR 0008): remove
        # `.truecourse/LATEST.json` before analyzing. `truecourse analyze`
        # (0.7.4) has no full-scan flag -- checked against `analyze --help` --
        # and with a baseline present it scans ONLY the files named by
        # `git diff <baseline commit>..HEAD` (plus the architecture pass,
        # which always runs whole). What the output then says about
        # every file it skipped depends on state this runner does not have:
        # previous findings are carried forward from the baseline only when the
        # branch recorded in it matches the checkout's branch, and are dropped
        # otherwise. Both outcomes corrupt a committed baseline: the first run
        # after the rollout dropped 913 of 922 findings (c8e9654, baseline
        # recorded on a feature branch), and the main-to-main runs after it
        # carried findings forward without ever re-scanning untouched files,
        # accreting stale entries for code that had since been fixed. A
        # baseline is a full-repo claim, so the run that produces it must see
        # the full repo: no anchor, cold scan, every time. A cold scan costs
        # ~8s of pipeline time, so there is nothing to save by diffing.
        #
        # Knowingly abandoned by going cold: finding continuity. A cold scan
        # re-mints every violation's id, firstSeenAt and status on every run,
        # so LATEST.json rewrites wholesale each refresh and no consumer may
        # read identity or age out of those fields — continuity across
        # refreshes lives in the git history of this file, keyed by rule.
        #
        # -f so an absent baseline (a repair dispatch after it was deleted)
        # does not deadlock the only job that can recreate it. If analyze ever
        # fails to recreate LATEST.json, the summary step fails the job
        # reading it, and the commit step independently refuses to commit a
        # missing baseline.
        run: rm -f .truecourse/LATEST.json

      - name: Analyze
        # --no-llm      deterministic rules only, on every merge. The reasons
        #               are ADR 0008's (cost per merge, LLM flap in a baseline,
        #               source egress) — not tooling availability; see the ADR
        #               before wiring an API key in here.
        # --no-stash    load-bearing for the cold scan: the tree deliberately
        #               carries a deleted tracked file (the baseline, removed
        #               above). Stashing would restore it and hand the run an
        #               anchor again — the exact corruption the removal exists
        #               to prevent.
        # --no-skills   suppress the Claude Code skills install prompt.
        run: truecourse analyze --no-llm --no-stash --no-skills

      - name: Summarise findings
        run: |
          node -e '
            const fs = require("node:fs");
            const latest = JSON.parse(fs.readFileSync(".truecourse/LATEST.json", "utf8"));
            const bySeverity = {};
            for (const v of latest.violations) {
              bySeverity[v.severity] = (bySeverity[v.severity] ?? 0) + 1;
            }
            const order = ["critical", "high", "medium", "low", "info"];
            const rows = order
              .filter((s) => bySeverity[s])
              .map((s) => `| ${s} | ${bySeverity[s]} |`)
              .join("\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
              `## TrueCourse baseline`,
              ``,
              `Commit \`${latest.analysis.commitHash ?? "unknown"}\` · ${latest.violations.length} active findings`,
              ``,
              `| severity | count |`,
              `|---|---:|`,
              rows,
              ``,
            ].join("\n"));
          '

      - name: Commit the refreshed baseline
        run: |
          set -euo pipefail
          # Never commit an absent or empty baseline: if analyze exited 0
          # without recreating LATEST.json, `git add` below would stage the
          # deletion and push a main with no baseline. The summary step also
          # fails on a missing file, but this step owns the invariant.
          test -s .truecourse/LATEST.json
          # Only LATEST.json is tracked. analyses/, history.json, logs/ and the
          # rest are per-checkout and already covered by .truecourse/.gitignore.
          if git diff --quiet -- .truecourse/LATEST.json; then
            echo "Baseline unchanged — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .truecourse/LATEST.json
          git commit -m "chore(truecourse): refresh analysis baseline for ${GITHUB_SHA:0:7}"
          # A push authenticated with GITHUB_TOKEN does not trigger workflows,
          # so this cannot loop back into another run of this job.
          git push origin HEAD:main
